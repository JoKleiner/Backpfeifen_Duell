<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein Spiel</title>
  <link rel="icon" href="Schelle_blau_icon.jpg">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

      /* 🖼️ Hintergrundbild */
      background-image: url("Bilder/Banane.jpeg");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
    }

    /* 📦 Content-Box */
    .content {
      max-width: 700px;
      margin: 80px auto;
      padding: 30px;

      background: rgba(255, 255, 255, 0.88);
      border-radius: 12px;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2ecc71;
      color: white;
    }

    button:hover {
      background: #27ae60;
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Backpfeifen-Duell</h1>

    <p>
      Ein spannendes Brettspiel für 2 Spieler.
    </p>

    <h2>Preis: 19,90 €</h2>

    <button onclick="window.location.href='https://www.paypal.com'">
      Jetzt kaufen
    </button>
  </div>

</body>
</html>
