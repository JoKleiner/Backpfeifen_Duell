<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Über das Spiel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            background: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 40px;

            background: white;
            padding: 30px;

            text-align: left;
            border-radius: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .item img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .text {
            flex: 1;
        }

        @media (max-width: 600px) {

            .container {
                padding: 10px;
            }

            .item {
                flex-direction: column;
                text-align: center;
            }

            .item img {
                width: 120px;
                height: 120px;
            }
        }
    </style>

</head>

<body>

    <div class="container">
        <h1>Die Leute</h1>


        <div class="item">
            <img src="Bilder/Eisenschelle.jpeg" alt="Bild 1">
            <div class="text">
                <h2>Dr. Eisenschelle</h2>
                <p>Coole Schläge.</p>
            </div>
        </div>


        <div class="item">
            <img src="Bilder/Knockout.jpeg" alt="Bild 1">
            <div class="text">
                <h2>Vito Knockout</h2>
                <p>Haut dich um.</p>
            </div>
        </div>


        <div class="item">
            <img src="Bilder/Vantage.jpeg" alt="Bild 1">
            <div class="text">
                <h2>Miss Vantage</h2>
                <p>Bäm. Voll in die Fresse.</p>
            </div>
        </div>


        <a href="index.html">⬅ Zurück zur Startseite</a>
    </div>

</body>

</html>
